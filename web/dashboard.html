<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>一氧化二氢 · 环境监测面板</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
  :root{
    --bg:#f7f9fc; --line:#e4e9f2; --text:#1b2333; --dim:#6b7891;
    --blue:#4d6bfe; --blue2:#6b86ff; --green:#10b981; --amber:#f59e0b; --red:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--text);min-height:100vh;padding:18px;
       background:
         radial-gradient(900px 420px at 12% -8%, #e8efff 0%, rgba(232,239,255,0) 60%),
         radial-gradient(700px 360px at 92% 0%, #e6f8f1 0%, rgba(230,248,241,0) 55%),
         var(--bg);
       font:14px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:19px;margin:0;font-weight:600;letter-spacing:.5px}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
         background:#fff;border:1px solid var(--line);font-size:12px;color:var(--dim);
         box-shadow:0 1px 2px rgba(27,35,51,.04)}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red)}
  .dot.on{background:var(--green);box-shadow:0 0 8px rgba(16,185,129,.7)}
  .spacer{flex:1}
  button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text);
         padding:7px 14px;border-radius:8px;font-size:13px;transition:.15s}
  button:hover{border-color:var(--blue);color:var(--blue)}
  button.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));border:0;color:#fff;
                 font-weight:600;box-shadow:0 4px 12px rgba(77,107,254,.25)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .grid{display:grid;gap:14px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;
        position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(27,35,51,.05)}
  .card::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;
        background:linear-gradient(90deg,rgba(77,107,254,0),var(--blue),var(--green))}
  .card .k{font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
  .card .v{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:6px;color:var(--blue)}
  .card .v small{font-size:13px;color:var(--dim);font-weight:400;margin-left:4px}
  .card.warn .v{color:var(--amber)} .card.bad .v{color:var(--red)} .card.ok .v{color:var(--green)}
  .row{grid-template-columns:1.35fr .9fr}
  @media(max-width:900px){.row{grid-template-columns:1fr}}
  .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;
       box-shadow:0 2px 10px rgba(27,35,51,.05)}
  .box h2{font-size:14px;margin:0 0 12px;color:var(--dim);font-weight:500;letter-spacing:.4px}
  #chart{width:100%;height:230px}
  .ctrl{margin-bottom:16px}
  .ctrl .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:6px}
  input[type=range]{width:100%;accent-color:var(--blue)}
  .btns{display:flex;gap:8px;margin-top:8px}
  .btns button{flex:1}
  .cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
  .cfg label{font-size:12px;color:var(--dim);display:block;margin-bottom:4px}
  .cfg input{width:100%;background:#fbfcfe;border:1px solid var(--line);color:var(--text);
             padding:8px 10px;border-radius:8px;font-size:13px}
  .cfg input:focus{outline:0;border-color:var(--blue)}
  .log{max-height:120px;overflow:auto;font:12px/1.6 ui-monospace,Consolas,monospace;color:var(--dim);
       background:#fbfcfe;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:12px}
  .log b{color:var(--blue)}
  footer{margin-top:18px;color:var(--dim);font-size:12px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>一氧化二氢 · 环境监测面板</h1>
  <span class="badge"><span class="dot" id="dot"></span><span id="state">未连接</span></span>
  <span class="badge" id="devTag">—</span>
  <span class="spacer"></span>
  <button id="btnConnect" class="primary">连接</button>
  <button id="btnDisconnect" disabled>断开</button>
</header>

<section class="grid cards" style="margin-bottom:14px">
  <div class="card"><div class="k"><span>温度</span><span id="tTime"></span></div>
    <div class="v" id="vTemp">--<small>°C</small></div></div>
  <div class="card"><div class="k"><span>湿度</span><span id="hTime"></span></div>
    <div class="v" id="vHumi">--<small>%RH</small></div></div>
  <div class="card"><div class="k"><span>烟雾浓度</span><span id="sTime"></span></div>
    <div class="v" id="vSmoke">--<small>ppm</small></div></div>
  <div class="card"><div class="k"><span>空气质量</span><span id="aTime"></span></div>
    <div class="v" id="vAir">--<small>ppm</small></div></div>
  <div class="card"><div class="k"><span>风扇档位</span><span id="fTime"></span></div>
    <div class="v" id="vFan">--<small>%</small></div></div>
  <div class="card"><div class="k"><span>舵机角度</span><span id="gTime"></span></div>
    <div class="v" id="vServo">--<small>°</small></div></div>
</section>

<section class="grid row" style="margin-bottom:14px">
  <div class="box">
    <h2>历史曲线（最近 60 点）</h2>
    <div id="chart"></div>
  </div>
  <div class="box">
    <h2>控制</h2>
    <div class="ctrl">
      <div class="lab"><span>风扇</span><span><b id="fanVal">0</b> %</span></div>
      <input type="range" id="fan" min="0" max="100" step="5" value="0" disabled />
      <div class="btns">
        <button data-fan="0" disabled>停转</button>
        <button data-fan="50" disabled>半速</button>
        <button data-fan="100" disabled>全速</button>
      </div>
    </div>
    <div class="ctrl">
      <div class="lab"><span>舵机</span><span><b id="servoVal">0</b> °</span></div>
      <input type="range" id="servo" min="0" max="180" step="5" value="0" disabled />
      <div class="btns">
        <button data-servo="0" disabled>关窗 0°</button>
        <button data-servo="90" disabled>开窗 90°</button>
      </div>
    </div>
  </div>
</section>

<section class="box">
  <h2>连接参数</h2>
  <div class="cfg">
    <div><label>WebSocket 地址</label><input id="url" value="wss://air-quality.luo-jin-ai.com/mqtt" /></div>
    <div><label>设备名称</label><input id="dev" value="yhyegj-01" /></div>
  </div>
  <div class="log" id="log"></div>
</section>

<footer>实时遥测 · WebSocket 直连 · 数据来自设备镜像通道</footer>

<script>
const $ = (id) => document.getElementById(id);
const series = {temperature:[], humidity:[], smoke:[]};
const MAXP = 60;
let ws = null, chart = null, devId = 'yhyegj-01';

function log(msg){
  const el = $('log');
  const t = new Date().toLocaleTimeString('zh-CN',{hour12:false});
  el.insertAdjacentHTML('afterbegin', `<div><b>${t}</b> ${msg}</div>`);
  while (el.childElementCount > 60) el.lastElementChild.remove();
}

function initChart(){
  chart = echarts.init($('chart'));
  chart.setOption({
    backgroundColor:'transparent',
    grid:{left:38,right:12,top:24,bottom:24},
    tooltip:{trigger:'axis',backgroundColor:'#fff',borderColor:'#e4e9f2',
             textStyle:{color:'#1b2333',fontSize:12},
             extraCssText:'box-shadow:0 6px 20px rgba(27,35,51,.12);border-radius:10px'},
    legend:{data:['温度','湿度','烟雾'],textStyle:{color:'#6b7891',fontSize:11},
            top:0,itemWidth:12,itemHeight:8},
    xAxis:{type:'category',show:false,data:[]},
    yAxis:[{type:'value',axisLine:{lineStyle:{color:'#e4e9f2'}},
            splitLine:{lineStyle:{color:'#eef2f8'}},axisLabel:{color:'#6b7891',fontSize:10}},
           {type:'value',show:false}],
    series:[
      {name:'温度',type:'line',smooth:true,symbol:'none',data:[],
       lineStyle:{width:2.5,color:'#4d6bfe'},areaStyle:{color:'rgba(77,107,254,.10)'}},
      {name:'湿度',type:'line',smooth:true,symbol:'none',data:[],
       lineStyle:{width:2.5,color:'#10b981'},areaStyle:{color:'rgba(16,185,129,.10)'}},
      {name:'烟雾',type:'line',smooth:true,symbol:'none',yAxisIndex:1,data:[],
       lineStyle:{width:2.5,color:'#f59e0b'}}
    ]
  });
  addEventListener('resize', () => chart.resize());
}

function pushPoint(name, value){
  if (value === null || value === undefined || Number.isNaN(value)) return;
  series[name].push(value);
  if (series[name].length > MAXP) series[name].shift();
  chart.setOption({series:[{data:series.temperature},{data:series.humidity},{data:series.smoke}]});
}

const UNITS = {vTemp:'°C', vHumi:'%RH', vSmoke:'ppm', vAir:'ppm', vFan:'%', vServo:'°'};
const STAMPS = {temperature:'tTime', humidity:'hTime', smoke:'sTime', air:'aTime',
                fan_level:'fTime', servo:'gTime'};
function setCard(id, value){
  const el = $(id);
  el.innerHTML = (value === null || value === undefined || Number.isNaN(value))
    ? `--<small>${UNITS[id]}</small>`
    : `${value}<small>${UNITS[id]}</small>`;
}

function applyTelemetry(d){
  if (d.temperature !== undefined){ setCard('vTemp', d.temperature); pushPoint('temperature', d.temperature); }
  if (d.humidity !== undefined){ setCard('vHumi', d.humidity); pushPoint('humidity', d.humidity); }
  if (d.smoke !== undefined){ setCard('vSmoke', d.smoke); pushPoint('smoke', d.smoke); }
  if (d.air !== undefined && d.air >= 0) setCard('vAir', d.air);
  if (d.fan_level !== undefined){
    setCard('vFan', d.fan_level);
    $('vFan').parentElement.className = 'card ' + (d.fan_level >= 80 ? 'bad' : d.fan_level > 0 ? 'warn' : '');
    $('fan').value = d.fan_level; $('fanVal').textContent = d.fan_level;
  }
  if (d.servo !== undefined){
    setCard('vServo', d.servo);
    $('servo').value = d.servo; $('servoVal').textContent = d.servo;
  }
  const now = new Date().toLocaleTimeString('zh-CN',{hour12:false});
  Object.values(STAMPS).forEach(id => { const el = $(id); if (el) el.textContent = now; });
}

function connect(){
  const url = $('url').value.trim();
  devId = $('dev').value.trim() || 'yhyegj-01';
  if (!url) { log('WebSocket 地址不能为空'); return; }
  $('btnConnect').disabled = true;
  log('连接 ' + url);
  ws = new WebSocket(url);

  ws.onopen = () => {
    $('dot').classList.add('on'); $('state').textContent = '已连接';
    $('devTag').textContent = devId;
    $('btnDisconnect').disabled = false;
    enableControls(true);
    ws.send(JSON.stringify({sub: `h2o/${devId}/#`}));
    log('已订阅 h2o/' + devId + '/#');
  };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.t === 'ready') { log('通道就绪'); return; }
    if (m.t === 'error') { log('服务端提示：' + m.msg); return; }
    if (m.t !== 'msg') return;
    let d; try { d = JSON.parse(m.data); } catch { return; }
    if (m.topic.endsWith('/telemetry')) applyTelemetry(d);
    else if (m.topic.endsWith('/cmd')) log('下发被回显：' + m.data);
  };
  ws.onclose = () => {
    $('dot').classList.remove('on'); $('state').textContent = '已断开';
    $('btnConnect').disabled = false; $('btnDisconnect').disabled = true;
    enableControls(false);
  };
  ws.onerror = () => log('连接出错');
}

function enableControls(on){
  ['fan','servo'].forEach(id => $(id).disabled = !on);
  document.querySelectorAll('[data-fan],[data-servo]').forEach(b => b.disabled = !on);
}

function publishCmd(obj){
  if (!ws || ws.readyState !== WebSocket.OPEN) { log('未连接，无法下发'); return; }
  ws.send(JSON.stringify({pub: `h2o/${devId}/cmd`, data: JSON.stringify(obj)}));
  log('下发 ' + JSON.stringify(obj));
}

document.addEventListener('DOMContentLoaded', () => {
  initChart();
  const saved = JSON.parse(localStorage.getItem('h2o-cfg') || '{}');
  if (saved.url) $('url').value = saved.url;
  if (saved.dev) $('dev').value = saved.dev;
  $('btnConnect').onclick = connect;
  $('btnDisconnect').onclick = () => { if (ws) ws.close(); };
  $('fan').oninput = (e) => { $('fanVal').textContent = e.target.value; };
  $('servo').oninput = (e) => { $('servoVal').textContent = e.target.value; };
  document.querySelectorAll('[data-fan]').forEach(b =>
    b.onclick = () => publishCmd({fan_level: Number(b.dataset.fan)}));
  document.querySelectorAll('[data-servo]').forEach(b =>
    b.onclick = () => publishCmd({servo: Number(b.dataset.servo)}));
  ['url','dev'].forEach(id => $(id).addEventListener('change', () =>
    localStorage.setItem('h2o-cfg', JSON.stringify({url: $('url').value, dev: $('dev').value}))));
});
</script>
</body>
</html>
