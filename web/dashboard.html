<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>一氧化二氢 · 环境监测面板</title>
<style>
  :root{
    --bg:#f7f9fc; --line:#e4e9f2; --text:#1b2333; --dim:#6b7891;
    --blue:#4d6bfe; --green:#10b981; --amber:#f59e0b; --red:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--text);min-height:100vh;padding:16px;
       background:
         radial-gradient(900px 420px at 12% -8%, #e8efff 0%, rgba(232,239,255,0) 60%),
         radial-gradient(700px 360px at 92% 0%, #e6f8f1 0%, rgba(230,248,241,0) 55%),
         var(--bg);
       font:14px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:18px;margin:0;font-weight:600}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
        background:#fff;border:1px solid var(--line);font-size:12px;color:var(--dim);white-space:nowrap}
  .pill b{color:var(--text);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:0 0 auto}
  .dot.on{background:var(--green);box-shadow:0 0 8px rgba(16,185,129,.7)}
  .dot.wait{background:var(--amber)}
  .spacer{flex:1}
  .fresh{font-size:12px;color:var(--dim)}
  .grid{display:grid;gap:12px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;
        position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(27,35,51,.05)}
  .card::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;
        background:linear-gradient(90deg,rgba(77,107,254,0),var(--blue),var(--green))}
  .card .k{font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
  .card .v{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px;color:var(--blue)}
  .card .v small{font-size:13px;color:var(--dim);font-weight:400;margin-left:3px}
  .card.warn .v{color:var(--amber)} .card.bad .v{color:var(--red)} .card.ok .v{color:var(--green)}
  .row{grid-template-columns:1.4fr .9fr}
  @media(max-width:860px){.row{grid-template-columns:1fr}}
  .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;
       box-shadow:0 2px 10px rgba(27,35,51,.05)}
  .box h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:500}
  .chart-wrap{position:relative;height:240px}
  #chart{width:100%;height:100%}
  .ctrl{margin-bottom:14px}
  .ctrl .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:5px}
  input[type=range]{width:100%;accent-color:var(--blue)}
  .btns{display:flex;gap:8px;margin-top:8px}
  .btns button{flex:1}
  button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text);
         padding:7px 12px;border-radius:8px;font-size:13px;transition:.15s}
  button:hover{border-color:var(--blue);color:var(--blue)}
  details{margin-top:4px;font-size:12px;color:var(--dim)}
  details summary{cursor:pointer}
  .cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
  .cfg label{font-size:12px;color:var(--dim);display:block;margin-bottom:4px}
  .cfg input{width:100%;background:#fbfcfe;border:1px solid var(--line);color:var(--text);
             padding:8px 10px;border-radius:8px;font-size:13px}
  footer{margin-top:16px;color:var(--dim);font-size:12px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>一氧化二氢 · 环境监测</h1>
  <div class="pills">
    <span class="pill"><span class="dot wait" id="dotOne"></span>OneNET <b id="stOne">检测中</b></span>
    <span class="pill"><span class="dot wait" id="dotSrv"></span>服务器 <b id="stSrv">检测中</b></span>
  </div>
  <span class="spacer"></span>
  <span class="fresh" id="fresh">等待数据…</span>
</header>

<section class="grid cards" style="margin-bottom:12px">
  <div class="card"><div class="k"><span>温度</span><span id="tTime"></span></div>
    <div class="v" id="vTemp">--<small>°C</small></div></div>
  <div class="card"><div class="k"><span>湿度</span><span id="hTime"></span></div>
    <div class="v" id="vHumi">--<small>%RH</small></div></div>
  <div class="card"><div class="k"><span>烟雾</span><span id="sTime"></span></div>
    <div class="v" id="vSmoke">--<small>ppm</small></div></div>
  <div class="card"><div class="k"><span>空气质量</span><span id="aTime"></span></div>
    <div class="v" id="vAir">--<small>ppm</small></div></div>
  <div class="card"><div class="k"><span>风扇</span><span id="fTime"></span></div>
    <div class="v" id="vFan">--<small>%</small></div></div>
  <div class="card"><div class="k"><span>舵机</span><span id="gTime"></span></div>
    <div class="v" id="vServo">--<small>°</small></div></div>
</section>

<section class="grid row" style="margin-bottom:12px">
  <div class="box">
    <h2>历史曲线 · 已存 <b id="ptCount">0</b> 点</h2>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>
  <div class="box">
    <h2>控制</h2>
    <div class="ctrl">
      <div class="lab"><span>风扇</span><span><b id="fanVal">0</b> %</span></div>
      <input type="range" id="fan" min="0" max="100" step="5" value="0" />
      <div class="btns">
        <button data-fan="0">停转</button><button data-fan="50">半速</button><button data-fan="100">全速</button>
      </div>
    </div>
    <div class="ctrl">
      <div class="lab"><span>舵机</span><span><b id="servoVal">0</b> °</span></div>
      <input type="range" id="servo" min="0" max="180" step="5" value="0" />
      <div class="btns">
        <button data-servo="0">关窗 0°</button><button data-servo="90">开窗 90°</button>
      </div>
    </div>
  </div>
</section>

<section class="box">
  <h2>运行信息</h2>
  <details>
    <summary>设备与地址（一般不用改）</summary>
    <div class="cfg">
      <div><label>设备名称</label><input id="dev" value="yhyegj-01" /></div>
      <div><label>数据接口</label><input id="api" value="/h2o/api" /></div>
      <div><label>WebSocket</label><input id="url" value="wss://air-quality.luo-jin-ai.com/mqtt" /></div>
    </div>
  </details>
</section>

<footer>打开即连 · 历史来自服务器 · 实时来自 WebSocket</footer>

<script src="/h2o/lib/chart.umd.min.js" defer></script>
<script>
const $ = (id) => document.getElementById(id);
const MAXP = 180;
const series = {temperature:[], humidity:[], smoke:[]};
const times = [];
let ws = null, chart = null, devId = 'yhyegj-01';
let apiBase = '/h2o/api', wsUrl = 'wss://air-quality.luo-jin-ai.com/mqtt';
let lastMsgAt = 0, lastOnenet = null, dirty = false;

function initChart(){
  if (typeof Chart === 'undefined') return false;
  chart = new Chart($('chart').getContext('2d'), {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        {label:'温度', data:[], borderColor:'#4d6bfe', backgroundColor:'rgba(77,107,254,.10)',
         borderWidth:2.5, tension:.35, pointRadius:0, fill:true, yAxisID:'y'},
        {label:'湿度', data:[], borderColor:'#10b981', backgroundColor:'rgba(16,185,129,.10)',
         borderWidth:2.5, tension:.35, pointRadius:0, fill:true, yAxisID:'y'},
        {label:'烟雾', data:[], borderColor:'#f59e0b', borderWidth:2.5, tension:.35,
         pointRadius:0, fill:false, yAxisID:'y1'}
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false, animation:false, normalized:true,
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{labels:{color:'#6b7891', boxWidth:10, boxHeight:8, font:{size:11}}},
        tooltip:{backgroundColor:'#fff', borderColor:'#e4e9f2', borderWidth:1,
                 titleColor:'#1b2333', bodyColor:'#1b2333', padding:10, cornerRadius:10}
      },
      scales:{
        x:{display:false, grid:{display:false}},
        y:{position:'left', grid:{color:'#eef2f8'}, border:{display:false},
           ticks:{color:'#6b7891', font:{size:10}, maxTicksLimit:5}},
        y1:{position:'right', display:false, grid:{display:false}}
      }
    }
  });
  return true;
}

function flushChart(){
  if (!chart || !dirty) return;
  chart.data.labels = times;
  chart.data.datasets[0].data = series.temperature;
  chart.data.datasets[1].data = series.humidity;
  chart.data.datasets[2].data = series.smoke;
  chart.update('none');
  dirty = false;
}

const UNITS = {vTemp:'°C', vHumi:'%RH', vSmoke:'ppm', vAir:'ppm', vFan:'%', vServo:'°'};
function setCard(id, value){
  const el = $(id);
  el.innerHTML = (value === null || value === undefined || value === '' || Number.isNaN(value))
    ? `--<small>${UNITS[id]}</small>` : `${value}<small>${UNITS[id]}</small>`;
}

function appendPoint(d){
  times.push(d.label || new Date().toLocaleTimeString('zh-CN',{hour12:false}));
  series.temperature.push(d.temperature ?? null);
  series.humidity.push(d.humidity ?? null);
  series.smoke.push(d.smoke ?? null);
  while (times.length > MAXP) {
    times.shift(); series.temperature.shift(); series.humidity.shift(); series.smoke.shift();
  }
  dirty = true;
}

function render(d){
  if (d.temperature !== undefined) setCard('vTemp', d.temperature);
  if (d.humidity !== undefined) setCard('vHumi', d.humidity);
  if (d.smoke !== undefined && d.smoke >= 0) setCard('vSmoke', d.smoke);
  if (d.air !== undefined && d.air >= 0) setCard('vAir', d.air);
  if (d.fan_level !== undefined){
    setCard('vFan', d.fan_level);
    $('vFan').parentElement.className = 'card ' + (d.fan_level >= 80 ? 'bad' : d.fan_level > 0 ? 'warn' : '');
    $('fan').value = d.fan_level; $('fanVal').textContent = d.fan_level;
  }
  if (d.servo !== undefined){
    setCard('vServo', d.servo);
    $('servo').value = d.servo; $('servoVal').textContent = d.servo;
  }
  if (d.onenet !== undefined) lastOnenet = Number(d.onenet) === 1;
  const now = new Date().toLocaleTimeString('zh-CN',{hour12:false});
  ['tTime','hTime','sTime','aTime','fTime','gTime'].forEach(id => {
    const e = $(id); if (e) e.textContent = now;
  });
}

function paintStatus(){
  const age = lastMsgAt ? (Date.now() - lastMsgAt) / 1000 : Infinity;
  const srvOn = !!(ws && ws.readyState === WebSocket.OPEN) && age < 20;
  $('dotSrv').className = 'dot ' + (srvOn ? 'on' : age < 60 ? 'wait' : '');
  $('stSrv').textContent = srvOn ? '在线' : (age < 60 ? '间歇' : '离线');
  $('dotOne').className = 'dot ' + (lastOnenet === true ? 'on' : lastOnenet === false ? '' : 'wait');
  $('stOne').textContent = lastOnenet === true ? '在线' : lastOnenet === false ? '离线' : '检测中';
  $('fresh').textContent = lastMsgAt
    ? `最后更新 ${age < 1 ? '刚刚' : age.toFixed(0) + ' 秒前'}` : '等待数据…';
}

async function loadHistory(){
  try {
    const r = await fetch(`${apiBase}/history?dev=${encodeURIComponent(devId)}&n=${MAXP}`, {cache:'no-store'});
    const j = await r.json();
    const pts = j.points || [];
    $('ptCount').textContent = pts.length;
    if (!pts.length) { paintStatus(); return; }
    times.length = 0; series.temperature.length = 0;
    series.humidity.length = 0; series.smoke.length = 0;
    pts.forEach(p => {
      const sec = p.at || p.ts || 0;
      const t = new Date(sec * 1000);
      appendPoint({...p, label: isNaN(t) ? '' : t.toLocaleTimeString('zh-CN',{hour12:false})});
    });
    flushChart();
    if (j.latest) { render(j.latest); lastMsgAt = Date.now(); }
    paintStatus();
  } catch (e) {
    $('fresh').textContent = '历史加载失败';
  }
}

function connect(){
  ws = new WebSocket(wsUrl);
  ws.onopen = () => { ws.send(JSON.stringify({sub: `h2o/${devId}/#`})); paintStatus(); };
  ws.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.t !== 'msg') return;
    let d; try { d = JSON.parse(m.data); } catch { return; }
    if (m.topic.endsWith('/telemetry')) {
      lastMsgAt = Date.now();
      render(d); appendPoint(d); flushChart(); paintStatus();
    }
  };
  ws.onclose = () => { paintStatus(); setTimeout(connect, 3000); };
  ws.onerror = () => {};
}

function publishCmd(obj){
  if (!ws || ws.readyState !== WebSocket.OPEN) { $('fresh').textContent = '通道未就绪'; return; }
  ws.send(JSON.stringify({pub: `h2o/${devId}/cmd`, data: JSON.stringify(obj)}));
}

function boot(){
  initChart();
  const saved = JSON.parse(localStorage.getItem('h2o-cfg') || '{}');
  if (saved.dev) devId = saved.dev;
  if (saved.url) wsUrl = saved.url;
  if (saved.api) apiBase = saved.api;
  $('dev').value = devId; $('url').value = wsUrl; $('api').value = apiBase;

  const remember = () => localStorage.setItem('h2o-cfg',
    JSON.stringify({dev:devId, url:wsUrl, api:apiBase}));
  $('dev').onchange = () => { devId = $('dev').value.trim() || 'yhyegj-01'; remember(); loadHistory(); };
  $('url').onchange = () => { wsUrl = $('url').value.trim(); remember(); if (ws) ws.close(); };
  $('api').onchange = () => { apiBase = $('api').value.trim(); remember(); loadHistory(); };

  $('fan').oninput = (e) => { $('fanVal').textContent = e.target.value; };
  $('servo').oninput = (e) => { $('servoVal').textContent = e.target.value; };
  document.querySelectorAll('[data-fan]').forEach(b =>
    b.onclick = () => publishCmd({fan_level: Number(b.dataset.fan)}));
  document.querySelectorAll('[data-servo]').forEach(b =>
    b.onclick = () => publishCmd({servo: Number(b.dataset.servo)}));

  loadHistory();
  connect();
  setInterval(loadHistory, 60000);
  setInterval(paintStatus, 1000);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>
