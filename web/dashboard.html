<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>一氧化二氢 · 环境监测面板</title>
<style>
  :root{
    --bg:#f7f9fc; --line:#e4e9f2; --text:#1b2333; --dim:#6b7891;
    --blue:#4d6bfe; --green:#10b981; --amber:#f59e0b; --red:#ef4444;
  }
  *{box-sizing:border-box}
  body{margin:0;color:var(--text);min-height:100vh;padding:16px;
       background:
         radial-gradient(900px 420px at 12% -8%, #e8efff 0%, rgba(232,239,255,0) 60%),
         radial-gradient(700px 360px at 92% 0%, #e6f8f1 0%, rgba(230,248,241,0) 55%),
         var(--bg);
       font:14px/1.5 "Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  h1{font-size:18px;margin:0;font-weight:600}
  .pills{display:flex;gap:8px;flex-wrap:wrap}
  .pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
        background:#fff;border:1px solid var(--line);font-size:12px;color:var(--dim);white-space:nowrap}
  .pill b{color:var(--text);font-weight:600}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--red);flex:0 0 auto}
  .dot.on{background:var(--green);box-shadow:0 0 8px rgba(16,185,129,.7)}
  .dot.wait{background:var(--amber)}
  .spacer{flex:1}
  .fresh{font-size:12px;color:var(--dim)}
  .grid{display:grid;gap:12px}
  .cards{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;
        position:relative;overflow:hidden;box-shadow:0 2px 10px rgba(27,35,51,.05)}
  .card::after{content:"";position:absolute;inset:0 0 auto 0;height:3px;
        background:linear-gradient(90deg,rgba(77,107,254,0),var(--blue),var(--green))}
  .card .k{font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
  .card .v{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:4px;color:var(--blue)}
  .card .v small{font-size:13px;color:var(--dim);font-weight:400;margin-left:3px}
  .card.warn .v{color:var(--amber)} .card.bad .v{color:var(--red)} .card.ok .v{color:var(--green)}
  .row{grid-template-columns:1.4fr .9fr}
  @media(max-width:860px){.row{grid-template-columns:1fr}}
  .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 14px;
       box-shadow:0 2px 10px rgba(27,35,51,.05)}
  .box h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:500}
  .chart-wrap{position:relative;height:240px}
  #chart{width:100%;height:100%}
  .ctrl{margin-bottom:14px}
  .ctrl .lab{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-bottom:5px}
  input[type=range]{width:100%;accent-color:var(--blue)}
  .btns{display:flex;gap:8px;margin-top:8px}
  .btns button{flex:1}
  button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--text);
         padding:7px 12px;border-radius:8px;font-size:13px;transition:.15s}
  button:hover{border-color:var(--blue);color:var(--blue)}
  details{margin-top:4px;font-size:12px;color:var(--dim)}
  details summary{cursor:pointer}
  .cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:10px}
  .cfg label{font-size:12px;color:var(--dim);display:block;margin-bottom:4px}
  .cfg input{width:100%;background:#fbfcfe;border:1px solid var(--line);color:var(--text);
             padding:8px 10px;border-radius:8px;font-size:13px}
  footer{margin-top:16px;color:var(--dim);font-size:12px;text-align:center}
  main{max-width:1360px;margin:auto}.box h2{font-size:16px;font-weight:650;color:var(--text)}
  #viewDevice{overflow-wrap:anywhere}.target>span{font-size:12px;color:var(--dim);max-width:100%}
  .target{display:flex;align-items:end;gap:8px;flex-wrap:wrap;margin:0 0 14px}.target label,.control-grid label{display:grid;gap:4px;font-size:12px;color:var(--dim)}
  input:not([type=range]){font:inherit;min-width:0;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#fbfcfe;color:var(--text)}
  .control-grid{display:grid;grid-template-columns:1fr auto;align-items:end;gap:9px}.control-grid button,.target button{min-height:38px}.control-grid button:enabled{background:#294bc6;color:white}
  button:disabled{cursor:default;color:#727d91;background:#f3f5fa}.note{color:var(--dim);font-size:12px}.mode{font-size:12px;font-weight:500;color:#445a81}.box,.chart-wrap{min-width:0}
  @media(max-width:500px){body{padding:12px}.cards{grid-template-columns:1fr 1fr}.chart-wrap{height:190px}.card .v{font-size:23px}.fresh{width:100%}}
</style>
</head>
<body>
<main>
<header>
  <h1>一氧化二氢 · 环境监测</h1>
  <div class="pills">
    <span class="pill"><span class="dot wait" id="dotOne"></span>OneNET <b id="stOne">待更新</b></span>
    <span class="pill"><span class="dot wait" id="dotSrv"></span>实时遥测 <b id="stSrv">待更新</b></span>
  </div>
  <span class="spacer"></span>
  <span class="fresh" id="fresh">等待数据…</span>
</header>

<form class="target" id="switcher"><label for="dev">切换到设备<input id="dev" value="yhyegj-01" required pattern="[A-Za-z0-9_\-]{1,64}" maxlength="64" autocomplete="off" /></label><button>切换设备</button><span>正在查看 <strong id="viewDevice"></strong></span></form>
<section class="grid cards" style="margin-bottom:12px">
  <div class="card"><div class="k"><span>温度</span><span id="tTime"></span></div>
    <div class="v" id="vTemp">--<small>°C</small></div></div>
  <div class="card"><div class="k"><span>湿度</span><span id="hTime"></span></div>
    <div class="v" id="vHumi">--<small>%RH</small></div></div>
  <div class="card"><div class="k"><span>烟雾</span><span id="sTime"></span></div>
    <div class="v" id="vSmoke">--<small>相对值</small></div></div>
  <div class="card"><div class="k"><span>空气质量</span><span id="aTime"></span></div>
    <div class="v" id="vAir">--<small>相对值</small></div></div>
  <div class="card"><div class="k"><span>风扇</span><span id="fTime"></span></div>
    <div class="v" id="vFan">--<small>%</small></div></div>
  <div class="card"><div class="k"><span>舵机</span><span id="gTime"></span></div>
    <div class="v" id="vServo">--<small>°</small></div></div>
</section>

<section class="grid row" style="margin-bottom:12px">
  <div class="box">
    <h2>遥测曲线 · 显示 <b id="ptCount">0</b> 点</h2>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
  </div>
  <div class="box">
    <h2>执行机构 <span class="mode" id="mode">只读</span></h2>
    <div class="control-grid">
      <label for="token">操作者令牌<input id="token" type="password" autocomplete="off" spellcheck="false" disabled /></label><button id="lock" disabled>清除令牌</button>
      <label for="fan_level">风扇占空比（0–100%）<input id="fan_level" type="number" min="0" max="100" step="1" placeholder="输入百分比" disabled /></label><button id="sendFan" disabled>设置风扇</button>
      <label for="servo">舵机设定角（0–180°）<input id="servo" type="number" min="0" max="180" step="1" placeholder="输入角度" disabled /></label><button id="sendServo" disabled>设置舵机</button>
    </div>
    <p role="status" id="receipt">正在检查设备控制权限…</p>
    <p class="note">读数来自设备上报。舵机显示设定角，烟雾与空气质量显示未标定的相对值。</p>
  </div>
</section>
</main>
<script src="./lib/chart.umd.min.js" defer></script>
<script>
const $ = (id) => document.getElementById(id);
const MAXP = 180;
const series = {temperature:[], humidity:[], smoke:[]};
const times = [];
let ws = null, chart = null, devId = 'yhyegj-01';
const apiBase = '/h2o/api';
const wsUrl = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/mqtt`;
let socketReceived = false;
let lastMsgAt = 0, historyAt = 0, lastOnenet = null, dirty = false;
let generation = 0, retry, livePoints = [], enabled = false, sending = false, historyFailed = false;

function initChart(){
  if (typeof Chart === 'undefined') return false;
  chart = new Chart($('chart').getContext('2d'), {
    type: 'line',
    data: {
      labels: [],
      datasets: [
        {label:'温度', data:[], borderColor:'#4d6bfe', backgroundColor:'rgba(77,107,254,.10)',
         borderWidth:2.5, tension:.35, pointRadius:0, fill:true, yAxisID:'y'},
        {label:'湿度', data:[], borderColor:'#10b981', backgroundColor:'rgba(16,185,129,.10)',
         borderWidth:2.5, tension:.35, pointRadius:0, fill:true, yAxisID:'y'},
        {label:'烟雾', data:[], borderColor:'#f59e0b', borderWidth:2.5, tension:.35,
         pointRadius:0, fill:false, yAxisID:'y1'}
      ]
    },
    options: {
      responsive:true, maintainAspectRatio:false, animation:false, normalized:true,
      interaction:{mode:'index', intersect:false},
      plugins:{
        legend:{labels:{color:'#6b7891', boxWidth:10, boxHeight:8, font:{size:11}}},
        tooltip:{backgroundColor:'#fff', borderColor:'#e4e9f2', borderWidth:1,
                 titleColor:'#1b2333', bodyColor:'#1b2333', padding:10, cornerRadius:10}
      },
      scales:{
        x:{display:false, grid:{display:false}},
        y:{position:'left', grid:{color:'#eef2f8'}, border:{display:false},
           ticks:{color:'#6b7891', font:{size:10}, maxTicksLimit:5}},
        y1:{position:'right', display:false, grid:{display:false}}
      }
    }
  });
  return true;
}

function flushChart(){
  if (!chart || !dirty) return;
  chart.data.labels = times;
  chart.data.datasets[0].data = series.temperature;
  chart.data.datasets[1].data = series.humidity;
  chart.data.datasets[2].data = series.smoke;
  chart.update('none');
  dirty = false;
}

const UNITS = {vTemp:'°C', vHumi:'%RH', vSmoke:'相对值', vAir:'相对值', vFan:'%', vServo:'°'};
function setCard(id, value){
  const el = $(id);
  const small = document.createElement('small');
  small.textContent = UNITS[id];
  el.replaceChildren(document.createTextNode(Number.isFinite(value) ? String(value) : '--'), small);
}

const fields = [
  ['temperature','vTemp','tTime'], ['humidity','vHumi','hTime'], ['smoke','vSmoke','sTime'],
  ['air','vAir','aTime'], ['fan_level','vFan','fTime'], ['servo','vServo','gTime']
];
function reading(d, key){
  const value = d[key];
  if (!Number.isFinite(value) || (key !== 'temperature' && value < 0)) return null;
  return value;
}
function clock(at){return new Date(at).toLocaleTimeString('zh-CN', {hour12:false});}
function appendPoint(d, at){
  times.push(at ? clock(at) : '时间未知');
  for (const key of Object.keys(series)) series[key].push(reading(d,key));
  if (times.length > MAXP){times.shift(); Object.values(series).forEach(a => a.shift());}
  dirty = true;
}
function render(d, at){
  for (const [key,id,stamp] of fields){
    const value = reading(d,key);
    setCard(id,value);
    $(stamp).textContent = value === null ? '暂无读数' : (at ? clock(at) : '时间未知');
  }
  const fan = reading(d,'fan_level');
  $('vFan').parentElement.className = 'card' + (fan >= 80 ? ' bad' : fan > 0 ? ' warn' : '');
}
function isLive(){
  return socketReceived && ws?.readyState === WebSocket.OPEN && Date.now()-lastMsgAt < 20000;
}
function paintStatus(){
  const live = isLive();
  $('dotSrv').className = 'dot ' + (live ? 'on' : 'wait');
  $('stSrv').textContent = live ? '在线' : lastMsgAt ? '已中断' : '待上报';
  const one = live ? lastOnenet : null;
  $('dotOne').className = 'dot ' + (one === 1 ? 'on' : one === 0 ? '' : 'wait');
  $('stOne').textContent = one === 1 ? '在线' : one === 0 ? '离线' : '未知';
  $('fresh').textContent = lastMsgAt && lastMsgAt >= historyAt ? `${live ? '实时' : '最后实时上报'} · ${clock(lastMsgAt)}` :
    historyAt ? `历史快照 · ${new Date(historyAt).toLocaleString('zh-CN',{hour12:false})}` : historyFailed ? '历史暂不可用' : '等待设备数据';
}
function clearChart(){times.length=0; Object.values(series).forEach(a=>a.length=0); dirty=true;}
function unixMs(sec){return Number.isFinite(sec) && sec >= 1577836800 && sec <= Date.now()/1000+60 ? sec*1000 : 0;}
async function loadHistory(){
  const selected = generation;
  try {
    const r = await fetch(`${apiBase}/history?dev=${encodeURIComponent(devId)}&n=${MAXP}`, {cache:'no-store',signal:AbortSignal.timeout(12000)});
    if (!r.ok) throw Error();
    const j = await r.json();
    if (selected !== generation || j.dev !== devId) return;
    historyFailed = false;
    clearChart();
    // The recorder keeps receiving samples even when this browser loses its socket.
    const merged = [...livePoints];
    for (const d of (Array.isArray(j.points) ? j.points : [])){
      if (!d || typeof d !== 'object') continue;
      const at = unixMs(d.at ?? d.ts);
      if (!at) continue;
      const duplicate = livePoints.some(p => Math.abs(at - p.at) < 1000 &&
        fields.every(([key]) => reading(p.d,key) === reading(d,key)));
      if (!duplicate) merged.push({d,at});
    }
    merged.sort((a,b) => a.at - b.at);
    for (const p of merged.slice(-MAXP)) appendPoint(p.d,p.at);
    if (j.latest){
      const at = unixMs(j.at ?? j.latest.ts);
      if (at && !isLive() && at >= historyAt && at > lastMsgAt){
        historyAt = at;
        render(j.latest,at);
      }
    }
    flushChart(); $('ptCount').textContent = times.length;
  } catch { if (selected === generation) historyFailed = true; }
  paintStatus();
}
function connect(){
  const selected = generation;
  const socket = new WebSocket(wsUrl), topic = `h2o/${devId}/telemetry`;
  ws = socket; socketReceived=false;
  socket.onopen = () => {if (selected === generation) socket.send(JSON.stringify({sub:topic}));};
  socket.onmessage = ev => {
    if (selected !== generation) return;
    try {
      const m = JSON.parse(ev.data);
      if (m.t !== 'msg' || m.topic !== topic) return;
      const d = JSON.parse(m.data);
      if (!d || typeof d !== 'object' || Array.isArray(d) ||
          !fields.some(([k]) => Number.isFinite(d[k])) && ![0,1].includes(d.onenet)) return;
      socketReceived=true; historyAt=0; lastMsgAt = Date.now(); lastOnenet = d.onenet;
      livePoints.push({d,at:lastMsgAt}); if (livePoints.length > MAXP) livePoints.shift();
      render(d,lastMsgAt); appendPoint(d,lastMsgAt); flushChart(); paintStatus(); $('ptCount').textContent=times.length;
    } catch {return;}
  };
  socket.onclose = () => {if (selected === generation){paintStatus();retry=setTimeout(connect,3000);}};
}
function controls(){
  $('token').disabled = !enabled;
  $('lock').disabled = !$('token').value;
  for (const [key,id] of [['fan_level','sendFan'],['servo','sendServo']]){
    const input=$(key);
    input.disabled=!enabled || sending;
    $(id).disabled=$('dev').value !== devId || !enabled || sending || !$('token').value || !input.value || !input.validity.valid;
  }
}
async function capability(){
  const selected=generation;
  let allowed=false, message='无法查询控制权限，请重新切换设备以重试。';
  try {
    const r=await fetch(`${apiBase}/control/status?dev=${encodeURIComponent(devId)}`,{cache:'no-store',mode:'same-origin',signal:AbortSignal.timeout(12000)});
    if (r.ok){
      const status=await r.json();
      if (status.enabled===false) message='当前设备未开放网页控制。';
      if (status.enabled===true){
        allowed=window.isSecureContext;
        message=allowed?'输入本次操作令牌及目标值。':'请通过 HTTPS 访问以控制设备。';
      }
    }
  } catch {}
  if (selected!==generation) return;
  enabled=allowed; $('mode').textContent=allowed?'需要令牌':'只读';
  $('receipt').textContent=message; controls();
}
async function command(key){
  if ($('dev').value !== devId || !enabled || sending || !$('token').value || !Number.isInteger($(key).valueAsNumber) || !$(key).validity.valid) return;
  const selected=generation, value=$(key).valueAsNumber;
  sending=true;controls();$('receipt').textContent=`${devId} · 等待设备回执…`;
  try {
    const r=await fetch(`${apiBase}/control`,{method:'POST',mode:'same-origin',redirect:'error',cache:'no-store',credentials:'omit',
      headers:{'Content-Type':'application/json',Authorization:`Bearer ${$('token').value}`},body:JSON.stringify({dev:devId,key,value}),signal:AbortSignal.timeout(12000)});
    const result=await r.json(); if(selected!==generation)return;
    if(r.status===401)$('token').value='';
    $('receipt').textContent=`${devId} · ${key==='servo'?'舵机':'风扇'} ${value}${key==='servo'?'°':'%'} · ${result.message || '回执未知'}`;
  } catch {if(selected===generation)$('receipt').textContent='回执未知，请核对遥测后再操作。';}
  finally {if(selected===generation){sending=false; controls();}}
}
function resetSource(){
  generation++; clearTimeout(retry); if (ws) ws.close(); ws=null;
  lastMsgAt=0;historyAt=0;lastOnenet=null;livePoints=[];historyFailed=false; enabled=false;sending=false;
  for(const id of ['token','fan_level','servo']) $(id).value='';
  $('mode').textContent='只读'; $('receipt').textContent='正在检查设备控制权限…'; $('viewDevice').textContent=devId;
  clearChart();flushChart();render({},0);$('ptCount').textContent='0';controls();paintStatus();loadHistory();capability();connect();
}
function boot(){
  initChart();
  $('switcher').onsubmit=e=>{e.preventDefault();devId=$('dev').value;resetSource();};
  for(const id of ['dev','token','fan_level','servo']) $(id).oninput=controls;
  $('lock').onclick=()=>{$('token').value='';controls();};
  window.addEventListener('pagehide',()=>{$('token').value='';controls();});
  $('sendFan').onclick=()=>command('fan_level'); $('sendServo').onclick=()=>command('servo');
  resetSource();setInterval(loadHistory,60000);setInterval(paintStatus,1000);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>
